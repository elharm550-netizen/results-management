<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-4">
        <header class="text-center mb-4">
            <h1 class="app-title">نظام إدارة النتائج</h1>
            <p class="text-muted">أضف الطلاب ثم فعّل لجنة الرأفة لمعالجة المتعثرين</p>
        </header>

        <div class="row g-4">
            <!-- نموذج الإدخال -->
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header fw-bold">بيانات الطالب</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="studentName" class="form-label">اسم الطالب</label>
                            <input type="text" id="studentName" class="form-control" placeholder="مثال: أحمد محمد">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-4">
                                <label for="grade1" class="form-label">درجة المادة 1</label>
                                <input type="number" id="grade1" class="form-control" placeholder="0 - 100">
                            </div>
                            <div class="col-12 col-sm-4">
                                <label for="grade2" class="form-label">درجة المادة 2</label>
                                <input type="number" id="grade2" class="form-control" placeholder="0 - 100">
                            </div>
                            <div class="col-12 col-sm-4">
                                <label for="grade3" class="form-label">درجة المادة 3</label>
                                <input type="number" id="grade3" class="form-control" placeholder="0 - 100">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="attendance" class="form-label">نسبة الحضور (%)</label>
                            <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
                        </div>

                        <div class="d-grid gap-2 d-sm-flex">
                            <button id="addBtn" class="btn btn-primary flex-fill">إضافة طالب</button>
                            <button id="mercyBtn" class="btn btn-warning flex-fill">تفعيل لجنة الرأفة</button>
                        </div>

                        <div id="errorBox" class="error-box mt-3" role="alert"></div>
                    </div>
                </div>
            </div>

            <!-- مناطق العرض -->
            <div class="col-lg-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header fw-bold">الطلاب المضافون</div>
                    <div class="card-body">
                        <div id="studentsBox"></div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header fw-bold">التقرير النهائي للجنة الرأفة</div>
                    <div class="card-body">
                        <div id="reportBox"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
